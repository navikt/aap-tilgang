openapi: 3.0.3
info:
  title: AAP Tilgang REST API
  description: API for evaluating access to Kelvin resources.
  version: 1.0.0
servers:
  - url: /
tags:
  - name: Tilgang
  - name: Roller
  - name: Drift
paths:
  /tilgang/sak:
    post:
      tags: [Tilgang]
      summary: Vurder tilgang til en sak
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SakTilgangRequest"
      responses:
        "200":
          description: Tilgangsvurdering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilgangResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /tilgang/behandling:
    post:
      tags: [Tilgang]
      summary: Vurder tilgang til en behandling
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BehandlingTilgangRequest"
      responses:
        "200":
          description: Tilgangsvurdering, inkludert resultat per operasjon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilgangResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /tilgang/arenasaker:
    post:
      tags: [Tilgang]
      summary: Vurder tilgang til Arena-saker for en person
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenasakTilgangRequest"
      responses:
        "200":
          description: Tilgangsvurdering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilgangResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /tilgang/journalpost:
    post:
      tags: [Tilgang]
      summary: Vurder tilgang til en journalpost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalpostTilgangRequest"
      responses:
        "200":
          description: Tilgangsvurdering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilgangResponse"
        "400":
          description: Saksbehandling krever avklaringsbehov eller påkrevd rolle
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /tilgang/test/tilgangsmaskinen:
    post:
      tags: [Tilgang]
      summary: Test tilgang mot Tilgangsmaskinen for flere identiteter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TilgangsmaskinRequest"
      responses:
        "200":
          description: Samlet tilgangsvurdering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilgangResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /tilgang/person:
    post:
      tags: [Tilgang]
      summary: Vurder tilgang til en person
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonTilgangRequest"
      responses:
        "200":
          description: Tilgangsvurdering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilgangResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /tilgang/tilbakekreving:
    post:
      tags: [Tilgang]
      summary: Vurder tilgang til en tilbakekreving
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TilbakekrevingTilgangRequest"
      responses:
        "200":
          description: Tilgangsvurdering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilgangResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /roller:
    get:
      tags: [Roller]
      summary: Hent rollene til innlogget ansatt
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roller identifisert fra tokenets gruppeclaims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rolle"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /actuator/live:
    get:
      tags: [Drift]
      summary: Liveness-probe
      security: []
      responses:
        "200":
          description: Tjenesten kjører
          content:
            text/plain:
              schema:
                type: string
  /actuator/ready:
    get:
      tags: [Drift]
      summary: Readiness-probe
      security: []
      responses:
        "200":
          description: Tjenesten er klar
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: Redis er ikke tilgjengelig
          content:
            text/plain:
              schema:
                type: string
  /actuator/metrics:
    get:
      tags: [Drift]
      summary: Prometheus-metrikker
      security: []
      responses:
        "200":
          description: Metrikker i Prometheus-tekstformat
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Manglende eller ugyldig autentisering
    RequestTimeout:
      description: Tidsavbrudd ved kall mot en integrasjon
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Uventet feil eller feil fra en integrasjon
      content:
        text/plain:
          schema:
            type: string
  schemas:
    TilgangResponse:
      type: object
      required: [tilgang]
      properties:
        tilgang:
          type: boolean
        tilgangIKontekst:
          type: object
          nullable: true
          additionalProperties:
            type: boolean
          description: Resultat per operasjon, satt for behandlingsvurderinger.
    SakTilgangRequest:
      type: object
      required: [saksnummer, operasjon]
      properties:
        saksnummer:
          type: string
        påkrevdRolle:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Rolle"
        operasjon:
          $ref: "#/components/schemas/Operasjon"
        relevanteIdenter:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RelevanteIdenter"
    BehandlingTilgangRequest:
      type: object
      required: [behandlingsreferanse, operasjon]
      properties:
        behandlingsreferanse:
          type: string
          format: uuid
        avklaringsbehovKode:
          type: string
          nullable: true
          deprecated: true
          description: Bruk påkrevdRolle i stedet.
        påkrevdRolle:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Rolle"
        operasjon:
          $ref: "#/components/schemas/Operasjon"
        relevanteIdenter:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RelevanteIdenter"
        operasjonerIKontekst:
          type: array
          deprecated: true
          description: Feltet er ikke i bruk.
          items:
            $ref: "#/components/schemas/Operasjon"
    JournalpostTilgangRequest:
      type: object
      required: [journalpostId, operasjon]
      properties:
        journalpostId:
          type: integer
          format: int64
        avklaringsbehovKode:
          type: string
          nullable: true
          deprecated: true
          description: Bruk påkrevdRolle i stedet.
        påkrevdRolle:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Rolle"
        operasjon:
          $ref: "#/components/schemas/Operasjon"
    ArenasakTilgangRequest:
      type: object
      required: [personIdent]
      properties:
        personIdent:
          type: string
        påkrevdRolle:
          type: array
          default: [LES, SAKSBEHANDLER_NASJONAL, SAKSBEHANDLER_OPPFOLGING, KVALITETSSIKRER, BESLUTTER]
          items:
            $ref: "#/components/schemas/Rolle"
        operasjon:
          allOf:
            - $ref: "#/components/schemas/Operasjon"
          default: SE
    PersonTilgangRequest:
      type: object
      required: [personIdent]
      properties:
        personIdent:
          type: string
        påkrevdRolle:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Rolle"
        operasjon:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Operasjon"
    TilbakekrevingTilgangRequest:
      type: object
      required: [saksnummer, behandlingsreferanse, operasjon]
      properties:
        saksnummer:
          type: string
        behandlingsreferanse:
          type: string
          format: uuid
        påkrevdRoller:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Rolle"
        operasjon:
          $ref: "#/components/schemas/Operasjon"
    RelevanteIdenter:
      type: object
      required: [søker, barn]
      properties:
        søker:
          type: array
          minItems: 1
          items:
            type: string
        barn:
          type: array
          items:
            type: string
    TilgangsmaskinRequest:
      type: object
      required: [brukerIdenter]
      properties:
        brukerIdenter:
          type: array
          items:
            $ref: "#/components/schemas/BrukerOgRegeltype"
    BrukerOgRegeltype:
      type: object
      required: [brukerId, type]
      properties:
        brukerId:
          type: string
        type:
          type: string
    Operasjon:
      type: string
      enum: [SE, SAKSBEHANDLE, DRIFTE, DRIFT_LES, DELEGERE]
    Rolle:
      type: string
      enum:
        - SAKSBEHANDLER_OPPFOLGING
        - SAKSBEHANDLER_NASJONAL
        - KVALITETSSIKRER
        - BESLUTTER
        - LES
        - PRODUKSJONSSTYRING
        - DRIFT
        - DRIFT_LES
